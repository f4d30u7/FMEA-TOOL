<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aplicación local-first para ejecutar AMFE de Proceso (PFMEA)." />
  <meta name="theme-color" content="#144c66" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>PFMEA Flow v0.4.1 · Aplicación local-first</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <dialog id="app-modal" class="modal">
    <form method="dialog" id="modal-form">
      <div class="modal-header">
        <div>
          <p class="eyebrow" id="modal-eyebrow">PFMEA Flow</p>
          <h2 id="modal-title">Formulario</h2>
        </div>
        <button type="button" class="icon-button" id="modal-close" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="button secondary" id="modal-cancel">Cancelar</button>
        <button type="submit" class="button primary" id="modal-submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="js/model.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch((error) => console.warn('Service Worker no disponible', error));
    }
  </script>
</body>
</html>
